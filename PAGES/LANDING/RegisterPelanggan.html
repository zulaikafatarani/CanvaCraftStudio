    <main class="container">
        <div class="form-box">
            <h2 style="text-align: center; margin-bottom: 1.5rem;">Daftar Akun Baru</h2>
            <form action="loginpelanggan.html" method="GET" onsubmit="alert('Registrasi Berhasil! Silakan Login.');">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>No. WhatsApp</label>
                    <input type="text" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Registrasi</button>
            </form>
            <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
                Sudah punya akun? <a href="loginpelanggan.html" style="color:#1abc9c; font-weight:bold;">Login</a>
            </p>
