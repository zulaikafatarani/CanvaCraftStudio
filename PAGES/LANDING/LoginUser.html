<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login User / Admin - CanvaCraftStudio</title>
    <link rel="stylesheet" href="../../ASSETS/1.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Login Admin - CanvaCraftStudio</div>
        
        <!-- PERBAIKAN: Memperbaiki susunan tag tombol hamburger yang rusak/pecah -->
        <div class="menu-toggle" id="mobile-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
        
        <!-- PERBAIKAN: Menambahkan id="nav-menu" agar dibaca JavaScript -->
        <ul class="nav-links" id="nav-menu"> 
            <!-- PERBAIKAN: Diarahkan mundur 2 kali ke index.html utama -->
            <li><a href="../../index.html">Beranda</a></li> 
            <li><a href="kategori.html">Kategori</a></li> 
            <li><a href="PRODUK.html">Produk</a></li> 
            <li><a href="Faq.html">FAQ</a></li> 
            <li><a href="Kontak.html">Kontak</a></li> 
            <li><a href="Legalitas.html">Legalitas</a></li> 
            <li><a href="LoginPelanggan.html">Login Pelanggan</a></li> 
            <li><a href="LoginUser.html" class="active">Login Admin</a></li> 
        </ul>  
    </nav>

    <main class="container">
        <div class="form-box" style="border-top: 5px solid #e74c3c;">
            <h2 style="text-align: center; margin-bottom: 1.5rem; color:#2c3e50;">Internal Login (Admin/User)</h2>
            <form action="../ADMIN/dashboard.html" method="GET">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" class="form-control" required placeholder="admin-user">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" required placeholder="******">
                </div>
                <button type="submit" class="btn" style="width: 100%; background:#2c3e50;">Masuk Dashboard</button>
            </form>
        </div>
    </main>

    <footer><p>&copy; 2026 CanvaCraftStudio. All Rights Reserved.</p></footer>

    <!-- PERBAIKAN: Menambahkan tag penutup body yang sempat hilang -->
    <script>
        const menuToggle = document.getElementById('mobile-menu');
        const navLinks = document.getElementById('nav-menu');

        if (menuToggle && navLinks) {
            menuToggle.addEventListener('click', () => {
                navLinks.classList.toggle('active');
            });
        }
    </script>
</body>
</html>
