<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Voucher Baru - Admin CanvaCraftStudio</title>
    <!-- Menghubungkan ke file CSS utama Anda (Mundur 3 tingkat ke root) -->
    <link rel="stylesheet" href="../../../ASSETS/1.css"> 
</head>
<body>

    <!-- 1. BAGIAN NAVBAR ADMIN -->
    <nav class="navbar">
        <div class="logo">CanvaCraftStudio Panel</div>
        
        <!-- Tombol menu hamburger untuk responsif mobile -->
        <div class="menu-toggle" id="mobile-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
        
        <!-- Daftar menu navbar atas -->
        <ul class="nav-links" id="nav-menu">
            <li><a href="../../../index.html">Lihat Website</a></li>
            <li><a href="../dashboard.html">Dashboard</a></li>
            <li><a href="../../LANDING/LoginUser.html" style="color: #e74c3c; font-weight: bold;">Keluar</a></li>
        </ul>
    </nav>

    <!-- 2. BAGIAN FORM INPUT VOUCHER DISKON -->
    <div class="container">
        <div class="form-box" style="margin-top: 2rem; border-top: 5px solid #1abc9c;">
            <h2 style="margin-bottom: 0.5rem; color: #2c3e50;">Buat Voucher Baru</h2>
            <p style="color: #7f8c8d; font-size: 0.9rem; margin-bottom: 1.5rem;">Silakan buat kode kupon potongan harga baru untuk menarik minat belanja UMKM.</p>
            
            <!-- Saat disubmit akan otomatis memunculkan simulasi alert dan kembali ke keloladiskon.html -->
            <form action="../keloladiskon.html" method="GET" onsubmit="alert('Voucher Promo Baru Berhasil Dibuat! (Simulasi Data)');">
                
                <!-- Input Kode Voucher -->
                <div class="form-group">
                    <label>Kode Voucher (Gunakan Huruf Kapital)</label>
                    <input type="text" class="form-control" placeholder="Contoh: COBAUNTUNG, DISKONHEMAT" style="text-transform: uppercase;" required>
                </div>

                <!-- Input Potongan Harga -->
                <div class="form-group">
                    <label>Potongan Harga</label>
                    <input type="text" class="form-control" placeholder="Contoh: 10% atau Rp 15.000" required>
                </div>

                <!-- Input Minimal Pembelian -->
                <div class="form-group">
                    <label>Minimal Pembelian</label>
                    <input type="text" class="form-control" placeholder="Contoh: Rp 0 atau Rp 100.000" required>
                </div>

                <!-- Pilihan Status Awal Promo -->
                <div class="form-group">
                    <label>Status Kupon</label>
                    <select class="form-control" required>
                        <option value="Aktif">Langsung Aktifkan</option>
                        <option value="Matikan">Simpan sebagai Draft (Mati)</option>
                    </select>
                </div>

                <!-- Tombol Aksi -->
                <div style="display: flex; gap: 10px; margin-top: 2rem;">
                    <button type="submit" class="btn" style="flex: 1; margin-top: 0;">Simpan Voucher</button>
                    <a href="../keloladiskon.html" class="btn" style="flex: 1; margin-top: 0; background: #95a5a6; text-align: center; display: flex; justify-content: center; align-items: center; text-decoration: none; color: white;">Batal</a>
                </div>
                
            </form>
        </div>
    </div>

    <!-- 3. BAGIAN FOOTER -->
    <footer><p>&copy; 2026 CanvaCraftStudio. Admin Panel View.</p></footer>

    <!-- 4. JAVASCRIPT UNTUK NAVBAR MOBILE SLIDE SAMPING -->
    <script>
        const menuToggle = document.getElementById('mobile-menu');
        const navLinks = document.getElementById('nav-menu');

        if (menuToggle && navLinks) {
            menuToggle.addEventListener('click', () => {
                navLinks.classList.toggle('active');
            });
        }
    </script>
</body>
</html>
