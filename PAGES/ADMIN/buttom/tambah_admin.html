<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Admin Baru - CanvaCraft Studio</title>
    <!-- Menghubungkan ke file CSS Anda -->
    <link rel="stylesheet" href="../../../ASSETS/1.css"> 
</head>
<body>

    <!-- 1. BAGIAN NAVBAR (Sesuai dengan class CSS Anda) -->
    <nav class="navbar">
        <div class="logo">CanvaCraft Studio</div>
        <ul class="nav-links">
            <li><a href="../../LANDING/BERANDA.html">Lihat Website </a></li>
            <li><a href="../dashboard.html">Dashboard</a></li>
            <li><a href="../kelolauser.html"style="color: #e74c3c; font-weight: bold;">Keluar</a></li>
        </ul>
        <!-- Tombol menu untuk responsif mobile -->
        <div class="menu-toggle">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <!-- 2. BAGIAN FORM INPUT (Berada di dalam .container agar posisinya rapi) -->
    <div class="container">
        <div class="form-box" style="margin-top: 2rem;">
            <h2 style="margin-bottom: 0.5rem; color: #2c3e50;">Tambah Admin Baru</h2>
            <p style="color: #7f8c8d; font-size: 0.9rem; margin-bottom: 1.5rem;">Silakan isi data petugas administrator baru di bawah ini.</p>
            
            <form action="../kelolauser.html" method="GET">
                
                <!-- Input Username -->
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" class="form-control" placeholder="Masukkan username..." required>
                </div>

                <!-- Input Nama Lengkap -->
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" class="form-control" placeholder="Masukkan nama lengkap..." required>
                </div>

                <!-- Input Email Perusahaan -->
                <div class="form-group">
                    <label>Email Perusahaan</label>
                    <input type="email" class="form-control" placeholder="nama@perusahaan.com" required>
                </div>

                <!-- Pilihan Hak Akses -->
                <div class="form-group">
                    <label>Hak Akses</label>
                    <select class="form-control" required>
                        <option value="">-- Pilih Hak Akses --</option>
                        <option value="Super Admin">Super Admin</option>
                        <option value="Staff Admin">Staff Admin</option>
                    </select>
                </div>

                <!-- Tombol Aksi -->
                <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
                    <button type="submit" class="btn" style="flex: 1; margin-top: 0;">Simpan Data</button>
                    <a href="../kelolauser.html" class="btn" style="flex: 1; margin-top: 0; background: #95a5a6; text-align: center; line-height: 1.6;">Batal</a>
                </div>
                
            </form>
        </div>
    </div>

</body>
</html>
